# kick-plugin-host settings. Restart after a change:
#   systemctl restart kick-plugin-host

# The instrument: a .vst3 or .lv2 bundle (or an LV2 URI).
plugin = /opt/kick-plugin-host/plugins/ebm_forge.lv2

# MIDI ports to listen to: fragments of port names, comma separated, "*" for all.
# The KICK application publishes Kick:Out:1 to Kick:Out:N; pick one in a MIDI
# program's output. External USB MIDI keyboards can be added by name.
midi_inputs = Kick:Out:1
# 1..16, or 0 for every channel.
midi_channel = 0

# The shared output from /etc/asound.conf, so the KICK keeps playing too.
audio_type = ALSA
audio_device = KICK shared output
sample_rate = 48000
block_size = 256
gain_db = 0

# The plugin's settings survive restarts here (saved when they change).
state_file = /media/kickstorage/plugin-host/state.xml
state_save_seconds = 30
