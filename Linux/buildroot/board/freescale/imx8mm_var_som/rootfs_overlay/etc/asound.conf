# Playback goes through dmix, so that the KICK application and the plugin host
# (kick-plugin-host) can play at the same time; card 0 alone admits only one.
# The rate, format and period below must suit the KICK application: check them
# against /proc/asound/card0/pcm0p/sub0/hw_params while it runs alone.

pcm.!default {
	type asym
	playback.pcm "play"
	capture.pcm "capture"
}

pcm.play {
	type plug
	slave.pcm "kickshare"
}

pcm.kickshare {
	type dmix
	ipc_key 70700
	ipc_perm 0666
	slave {
		pcm card0
		format S32_LE
		rate 48000
		channels 2
		period_size 256
		buffer_size 1024
	}
	bindings {
		0 0
		1 1
	}
	hint {
		show on
		description "KICK shared output"
	}
}

pcm.capture {
	type plug
	slave {
		pcm card0
		format S32_LE
		rate 48000
	}
}

# Kept for anything that asked for it by name.
pcm.convert {
	type plug
	slave.pcm "kickshare"
}

pcm.card0 {
	type hw
	card 0
}

ctl.card0 {
	type hw
	card 0
}
